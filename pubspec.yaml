name: daksh
description: "A new Flutter project."
publish_to: 'none'

version: 2.1.15+225

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  dartz: ^0.10.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  intl: ^0.20.2
  path: ^1.9.0
  path_drawing: ^1.0.1
  camera: 0.10.6
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  google_fonts: ^9.0.0
  sqflite: ^2.4.4
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  in_app_update: ^5.0.0
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dakshlogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/dakshlogo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
